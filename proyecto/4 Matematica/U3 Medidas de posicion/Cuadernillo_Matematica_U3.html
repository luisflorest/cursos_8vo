<style>
:root{color-scheme:light;--paper:#f5f4ee;--white:#fff;--ink:#192c2a;--muted:#47615b;--line:#d9e0d8;--deep:#123d35;--mint:#dcece0;--accent:#25624e;--wash:#eaf2e9;--amber:#75511a;--amber-bg:#fff0d8}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #8b531d;outline-offset:3px}
[hidden]{display:none!important}
.skip{position:absolute;left:12px;top:-80px;z-index:2;background:#fff;color:var(--deep);padding:10px}
.skip:focus{top:8px}
header{border-bottom:1px solid var(--line);background:#fcfbf6}
.top{max-width:1170px;margin:auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--deep);color:#dcece0;font-weight:800}
.brand strong,.brand small{display:block;line-height:1.25}
.brand small{color:var(--muted);font-size:.78rem;margin-top:4px}
.plain,.pill,.nav-button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px}
.plain[aria-pressed=true],.pill[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
main{max-width:1170px;margin:auto;padding:22px 24px 44px}
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:end;gap:22px;background:var(--deep);color:#fff;padding:24px 28px;border-radius:19px}
.hero::after{content:"";position:absolute;width:310px;height:310px;right:-95px;top:-151px;border:1px solid #ffffff32;border-radius:50%;box-shadow:0 0 0 28px #ffffff0a,0 0 0 59px #ffffff07;pointer-events:none}
.hero>*{position:relative;z-index:1}
.kicker{color:#d3e9d8;font-size:.78rem;font-weight:700;letter-spacing:.045em}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.65rem,4vw,2.45rem);line-height:1.13;margin:5px 0 8px;letter-spacing:-.035em}
.hero p{color:#e3eee7}
.track{width:205px;flex:none}
.track label{display:block;font-size:.8rem;color:#e3eee7;margin-bottom:4px}
progress{display:block;width:100%;height:9px;appearance:none;border:0;border-radius:9px;overflow:hidden;background:#ffffff2e}
progress::-webkit-progress-bar{background:#ffffff2e}
progress::-webkit-progress-value{background:#b6e6a5}
progress::-moz-progress-bar{background:#b6e6a5}
.grid{display:grid;grid-template-columns:245px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
aside,.card{background:#fff;border:1px solid var(--line);border-radius:16px}
aside{padding:15px}
aside h2{font-size:.95rem;margin:0 0 8px}
.units,.items{display:grid;gap:6px}
.units{margin-bottom:17px}
.unit,.item{width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:9px;color:var(--ink);padding:8px 9px}
.unit{border-color:var(--line);font-size:.88rem}
.unit strong,.unit span{display:block}
.unit span{color:var(--muted);font-size:.78rem}
.unit[aria-current=true],.item[aria-current=true]{background:var(--wash);border-color:#a5c4af;color:var(--deep)}
.item{display:grid;grid-template-columns:24px 1fr;gap:7px;font-size:.86rem;line-height:1.32;align-items:start}
.item:hover,.unit:hover,.plain:hover,.pill:hover,.nav-button:hover{filter:brightness(.97)}
.index{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-weight:700;background:#edf0ec;color:var(--deep);font-size:.75rem}
.item.done .index{background:#cde9c8}
.card{padding:clamp(15px,3vw,25px);min-width:0}
.lesson-count{color:var(--accent);font-weight:700;font-size:.8rem}
h2#lesson-title{font-size:clamp(1.35rem,3.5vw,1.88rem);line-height:1.2;letter-spacing:-.025em;margin:4px 0 5px}
.intro{color:var(--muted)}
.explore{margin-top:14px;padding:13px;border:1px solid #dce7dc;background:#f3f7f2;border-radius:13px}
.controls{display:flex;flex-wrap:wrap;gap:6px}
.controls button{padding:6px 9px;font-size:.83rem}
.board{display:grid;min-height:106px;place-items:center;margin:9px 0 3px}
.board canvas{display:block;width:min(100%,570px);height:auto;border-radius:10px}
.scene{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:9px 0}
.tile{display:grid;place-items:center;max-width:100%;min-height:53px;padding:8px 13px;text-align:center;background:#fff;border:1px solid #d0ddd2;border-radius:10px;font-weight:700;overflow-wrap:anywhere}
.tile:nth-child(2n){background:#e2eee4}
.legend{font-size:.89rem;color:var(--muted);text-align:center;max-width:62ch;margin:auto}
.range-box{width:min(100%,430px);padding:10px 0}
.range-box label{display:flex;justify-content:space-between;font-weight:650}
.range-box input{display:block;width:100%;accent-color:var(--accent)}
.reading{font-weight:700;text-align:center;margin-top:7px;color:var(--deep)}
details{border:1px solid var(--line);border-radius:10px;padding:8px 11px}
summary{font-weight:700;cursor:pointer}
.feedback{font-size:.9rem;font-weight:650;margin-top:7px;color:var(--accent)}
.feedback:empty{display:none}
.feedback.retry{color:var(--amber)}
.navigation{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.next{background:var(--deep);color:#fff;border-color:var(--deep)}
.nav-button:disabled{opacity:.53;cursor:default}
.focus-mode aside{display:none}
.focus-mode .grid{grid-template-columns:minmax(0,1fr);max-width:740px;margin-left:auto;margin-right:auto}
@media (max-width:720px){
  .top,main{padding-left:13px;padding-right:13px}
  main{padding-top:14px}.hero{align-items:stretch;flex-direction:column;padding:18px;gap:12px}
  .track{width:min(100%,210px)}.grid{grid-template-columns:minmax(0,1fr)}
  aside{order:2}.card{order:1}
}
@media print{header,aside,.controls,.navigation{display:none!important}.hero{background:#fff;color:#000;border:1px solid #999}.hero p,.kicker,.track label{color:#333}.grid{display:block}.hero::after{display:none}.card{margin-top:12px;break-inside:avoid}}

.mode-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0 12px}
.mode-tab{min-height:45px;border:1px solid #c9d9ce;background:#f6f9f5;color:var(--deep);font-weight:700;border-radius:10px;padding:8px}
.mode-tab[aria-pressed=true]{background:var(--deep);color:#fff;border-color:var(--deep)}
.eyebrow{color:var(--accent);font-size:.8rem;font-weight:750;margin-bottom:3px}
.guided{background:#f0f6ee;border:1px solid #d7e4d5;border-radius:13px;padding:clamp(12px,2.3vw,20px)}
.guided h3,.worked h3,.exercise h3{font-size:clamp(1.13rem,2.2vw,1.35rem);line-height:1.25;margin-bottom:8px}
.teaching{max-width:70ch}.teaching p+p{margin-top:9px}
.guided .scene{justify-content:flex-start;padding-bottom:0}
.guided .tile{min-height:auto;padding:6px 10px;font-size:.91rem}
.step-navigation{margin-top:12px}.step-navigation button{font-size:.88rem}
.explorer,.worked{margin-top:12px}
.explorer .intro{margin-top:8px}
.worked{padding:clamp(12px,2.3vw,20px);border-radius:13px;background:#fbf8ef;border:1px solid #e9dfc7}
.worked ol{margin:8px 0;padding-left:24px}
.worked li{margin:3px 0}
.worked-result{font-weight:700;color:#514021;margin-top:7px}
.practice-cta{margin-top:12px}
.exercise{background:#f7faf6;border:1px solid #dbe6db;border-radius:13px;padding:clamp(12px,2.3vw,19px)}
.exercise-prompt{max-width:70ch;margin-bottom:10px}
.reference{background:#fff;margin:10px 0}
.reference p,.solution p{margin-top:6px}
.case-nav{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:8px;text-align:center;padding:8px 0;margin:8px 0;border-block:1px solid var(--line)}
.case-nav>div{line-height:1.35}
.case-nav span{display:block;font-size:.8rem;color:var(--muted)}
.case-nav button{padding:4px 0}
.exercise-fields{display:grid;gap:8px;margin:9px 0}
.field{display:grid;gap:4px;font-size:.94rem;font-weight:650}
.field input,.field select{min-width:0;width:100%;max-width:560px;min-height:42px;background:#fff;border:1px solid #adc2b3;color:var(--ink);border-radius:8px;padding:7px 9px;font:inherit;font-weight:500}
.field [aria-invalid=true]{border-color:#a66b2d;background:#fff5e8}
.field [data-checked=true]{border-color:#7aab7d;background:#f2f8ef}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.solution{background:#fff;margin-top:10px}
.chapter-nav{border-top:1px solid var(--line);padding-top:12px}
.chapter-nav .nav-button,.exercise-nav .nav-button{font-size:.9rem}
.builder{background:white;border:1px solid #dce7da;border-radius:11px;padding:9px;margin:7px 0 10px}
.builder canvas{display:block;width:min(100%,570px);height:auto;margin:auto}
.orbital-row{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:8px;margin:6px 0}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slots button{width:45px;height:42px;padding:0;color:#153e35;background:#f0f6ef;font-size:1.1rem}
.builder-count{font-size:.88rem;color:var(--muted);margin-top:7px}
.lewis{display:grid;grid-template:43px 43px 43px / 46px 46px 46px;justify-content:center;align-items:stretch;gap:5px}
.lewis button{padding:0;font-size:1.2rem;font-weight:800;line-height:1}
.lewis strong{display:grid;place-items:center;font-size:1.4rem;color:var(--deep)}
.lewis>:nth-child(1){grid-area:1/2}.lewis>:nth-child(2){grid-area:2/3}.lewis>:nth-child(3){grid-area:3/2}.lewis>:nth-child(4){grid-area:2/1}.lewis strong{grid-area:2/2}
@media (max-width:450px){
  .mode-tab{font-size:.84rem}
  .step-navigation button,.chapter-nav .nav-button,.exercise-nav .nav-button{padding:7px 8px;font-size:.8rem}
  .guided .tile{font-size:.82rem}
}


.unit-finished{margin-top:13px;border:1px solid #accbb2;border-radius:12px;background:#e3f2de;color:#1e4b3b;padding:12px 16px}
.unit-finished strong{font-size:1.05rem}
.unit-finished p{font-size:.92rem}
.topic-progress{color:#47615b;font-size:.86rem;font-weight:600;margin-top:4px}
.field textarea{width:100%;max-width:650px;min-height:96px;padding:8px 9px;border-radius:9px;border:1px solid #adc2b3;background:#fff;color:var(--ink);font:inherit;resize:vertical}
.field textarea:focus-visible{outline:3px solid #8b531d;outline-offset:3px}
.rubric{display:flex;gap:9px;align-items:start;background:#edf6ea;border:1px solid #bdd3bb;border-radius:9px;padding:9px;margin-top:10px}
.rubric input{margin-top:5px;accent-color:#215843}
.sequence{margin:8px 0;min-height:26px;padding-left:25px}
.sequence li{padding:3px 6px}
.sequence+.nav-button{font-size:.86rem}
.passage{background:#fbf8ef;margin:10px 0}
.passage blockquote{margin:8px 0;white-space:pre-line}
.data-table{width:min(100%,440px);margin:10px 0}
.data-table table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.data-table td,.data-table th{border:1px solid #cfddd0;padding:5px 8px;text-align:left}
.data-table th{background:#e6efe4}
h2[tabindex="-1"]:focus,h3[tabindex="-1"]:focus,strong[tabindex="-1"]:focus{outline:none}

.item[aria-current=true] { border-color:var(--accent); background:var(--wash); color:var(--deep); font-weight:720; }

function switcher(labels, render) {
  const buttons = labels.map((label, index) => {
    const el = button(label, "pill");
    el.addEventListener("click", () => activate(index));
    byId("controls").append(el);
    return el;
  });
  function activate(index) {
    buttons.forEach((el, i) => el.setAttribute("aria-pressed", String(i === index)));
    render(index);
  }
  activate(0);
}

function diagram(label, draw) {
  const canvas = document.createElement("canvas");
  canvas.width = 1140;
  canvas.height = 390;
  canvas.setAttribute("role", "img");
  canvas.setAttribute("aria-label", label);
  byId("board").replaceChildren(canvas);
  const ctx = canvas.getContext("2d");
  ctx.scale(2, 2);
  ctx.fillStyle = "#fbfdf9";
  ctx.fillRect(0, 0, 570, 195);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  draw(ctx);
}

function line(ctx, points, color = "#35594e", width = 3) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  points.forEach(([x, y], index) => index ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.stroke();
}

function dot(ctx, x, y, radius, fill, stroke = "#35594e", width = 2) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, 2 * Math.PI);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = width;
  ctx.stroke();
}

function label(ctx, text, x, y, color = "#24453d") {
  ctx.fillStyle = color;
  ctx.font = "650 16px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function showCircuit() {
  let parallel = false;
  let open = false;
  const seriesButton = button("En serie", "pill");
  const parallelButton = button("En paralelo", "pill");
  const toggle = button("Abrir el interruptor", "pill");
  byId("controls").append(seriesButton, parallelButton, toggle);
  seriesButton.onclick = () => { parallel = false; draw(); };
  parallelButton.onclick = () => { parallel = true; draw(); };
  toggle.onclick = () => { open = !open; draw(); };
  draw();

  function draw() {
    seriesButton.setAttribute("aria-pressed", String(!parallel));
    parallelButton.setAttribute("aria-pressed", String(parallel));
    toggle.textContent = open ? "Cerrar el interruptor" : "Abrir el interruptor";
    const lamp1 = !open;
    const lamp2 = parallel || !open;
    const message = open ? (parallel
      ? "La rama de A queda abierta. B sigue encendida porque mantiene un camino cerrado."
      : "El interruptor corta el único camino. Las dos ampolletas se apagan.")
      : (parallel ? "A y B están en ramas distintas. Las dos reciben el voltaje de la pila."
      : "A y B comparten el mismo camino. La corriente que pasa por ambas es igual.");
    byId("legend").textContent = message;
    diagram("Circuito " + (parallel ? "en paralelo. " : "en serie. ") + message, ctx => {
      const wire = "#52746a";
      const live = "#257052";
      const top = 46;
      const bottom = 143;
      line(ctx, [[95,top],[95,bottom],[263,bottom]], wire, 4);
      line(ctx, [[301,bottom],[475,bottom],[475,top],[209,top]], wire, 4);
      line(ctx, [[95,top],[159,top]], wire, 4);

function electronBuilder(parent, task, values) {
  const panel = document.createElement("div");
  panel.className = "builder";
  const counter = document.createElement("p");
  counter.className = "builder-count";
  counter.setAttribute("aria-live","polite");
  let groupIndex = 0;
  function addSlots(container, names, glyphs) {
    const group = values[groupIndex] ??= names.map(() => 0);
    groupIndex++;
    names.forEach((name,index) => {
      const slot = button("","nav-button");
      function refresh() {
        const count = group[index];
        slot.textContent = glyphs[count];
        slot.setAttribute("aria-label",name + ": " + count + (count === 1 ? " electrón" : " electrones"));
      }
      slot.onclick = () => {
        group[index] = (group[index] + 1) % 3;
        refresh();
        updateCount();
        queueSave();
      };
      refresh();
      container.append(slot);
    });
  }
  function updateCount() {
    const total = values.flat().reduce((sum,current) => sum + current,0);
    counter.textContent = "Electrones colocados: " + total;
  }
  function equivalent(a,b) {
    return [...a].sort().join(",") === [...b].sort().join(",");
  }
  if (task.kind === "lewis") {
    const arrangement = document.createElement("div");
    arrangement.className = "lewis";
    addSlots(arrangement,["Arriba","Derecha","Abajo","Izquierda"],["○","•","••"]);
    const symbol = document.createElement("strong");
    symbol.textContent = task.symbol;
    arrangement.append(symbol);
    panel.append(arrangement,counter);
    parent.append(panel);
    updateCount();
    return () => ({passed:Number(task.patterns.some(pattern => equivalent(pattern,values[0]))),total:1});
  }
  for (const [name, occupancy] of task.groups) {
    const row = document.createElement("div");
    row.className = "orbital-row";
    const heading = document.createElement("strong");
    heading.textContent = name;
    const slots = document.createElement("div");
    slots.className = "slots";
    addSlots(slots,occupancy.map((_,index) => name + ", casillero " + (index + 1)),["—","↑","↑↓"]);
    row.append(heading,slots);
    panel.append(row);
  }
  panel.append(counter);
  parent.append(panel);
  updateCount();
  return () => ({
    passed:task.groups.filter(([,occupancy], index) => equivalent(occupancy,values[index])).length,
    total:task.groups.length
  });
}

function circuitBuilder(parent, task, draft) {
  const parallel = task.layout === "paralelo";
  const parts = ["Pila","Interruptor cerrado","Interruptor abierto","Ampolleta","Resistencia","Cable"];
  const slots = parallel ? [
    ["Rama superior",4,293,29,"R₁"],["Rama del medio",4,293,72,"R₂"],
    ["Rama inferior",4,293,115,"R₃"],["Alimentación",0,293,153,"Pila"]
  ] : [
    ["Lugar 1",1,184,51,"Interruptor"],["Lugar 2",3,302,51,"Ampolleta A"],
    ["Lugar 3",3,420,51,"Ampolleta B"],["Alimentación",0,293,144,"Pila"]
  ];
  const panel = document.createElement("div");
  panel.className = "builder";
  parent.append(panel);
  const fields = slots.map(([label,answer]) => ({label,kind:"pick",options:parts,answer}));
  const widgets = fieldGroup(parent,fields,draft);
  widgets.forEach(widget => widget.control.addEventListener("change",draw));
  draw();
  return () => checkFields(widgets);

  function draw() {
    const canvas = document.createElement("canvas");
    canvas.width = 1140;
    canvas.height = 390;
    canvas.setAttribute("role","img");
    canvas.setAttribute("aria-label","Esquema en " + task.layout + ". " + slots.map(([name],index) => {
      const selected = widgets[index].control.value;
      return name + ": " + (selected === "" ? "vacío" : parts[Number(selected)]);
    }).join(". "));
    panel.replaceChildren(canvas);
    const ctx = canvas.getContext("2d");
    ctx.scale(2,2);
    ctx.fillStyle = "#f8fbf6";
    ctx.fillRect(0,0,570,195);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const upper = parallel ? 29 : 51;
    const lower = parallel ? 153 : 144;
    line(ctx,[[86,upper],[86,lower],[260,lower]]);
    line(ctx,[[326,lower],[484,lower],[484,upper]]);
    if (parallel) {
      for (const y of [29,72,115]) {
        line(ctx,[[86,y],[260,y]]);
        line(ctx,[[326,y],[484,y]]);
        if (y > upper) {
          dot(ctx,86,y,3,"#35594e");
          dot(ctx,484,y,3,"#35594e");
        }
      }
    } else {
      for (const [start,end] of [[86,151],[217,269],[335,387],[453,484]]) {
        line(ctx,[[start,upper],[end,upper]]);
      }
    }
    slots.forEach(([,want,x,y,name],index) => {
      const value = widgets[index].control.value;
      drawPart(ctx,x,y,value === "" ? -1 : Number(value),name,want);
    });
  }

  function drawPart(ctx,x,y,part,name,want) {
    const pink = "#a36b30";
    if (part === -1) {
      ctx.setLineDash([4,5]);
      line(ctx,[[x-33,y],[x+33,y]],"#91a79a",2);
      ctx.setLineDash([]);
      return;
    }
    const width = [13,21,21,12,22,0][part];
    line(ctx,[[x-33,y],[x-width,y]]);
    line(ctx,[[x+width,y],[x+33,y]]);
    if (part === 0) {
      line(ctx,[[x-13,y],[x-6,y]]);
      line(ctx,[[x+6,y],[x+13,y]]);
      line(ctx,[[x-6,y-14],[x-6,y+14]]);
      line(ctx,[[x+6,y-8],[x+6,y+8]]);
      label(ctx,"+",x-20,y-13);
      label(ctx,"−",x+20,y-13);
    } else if (part === 1 || part === 2) {
      dot(ctx,x-21,y,3,"#fff");
      dot(ctx,x+21,y,3,"#fff");
      line(ctx,[[x-21,y],[part===1 ? x+21 : x+13,part===1 ? y : y-13]],pink,2.5);
    } else if (part === 3) {
      dot(ctx,x,y,12,"#fff0cb",pink,2);
      line(ctx,[[x-5,y-5],[x+5,y+5]],pink,2);
      line(ctx,[[x+5,y-5],[x-5,y+5]],pink,2);
    } else if (part === 4) {
      line(ctx,[[x-22,y],[x-16,y-7],[x-8,y+7],[x,y-7],[x+8,y+7],[x+16,y-7],[x+22,y]],"#35594e",2);
    }
    const chosen = part === want ? name : parts[part];
    label(ctx,chosen,x,y+23);
  }
}

function normalizeConfiguration(value) {
  const superscript = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  let remaining = value.trim().toLowerCase()
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, digit => String(superscript.indexOf(digit)))
    .replace(/[\s^,]+/g,"");
  const noble = remaining.match(/^\[(he|ne|ar|kr)\]/)?.[0] || "";
  remaining = remaining.slice(noble.length);
  const tokens = [];
  const seen = new Set();
  while (remaining) {
    const token = remaining.match(/^([1-7][spdf])(10|11|12|13|14|[1-9])(?=[1-7][spdf]|$)/);
    if (!token || seen.has(token[1])) return null;
    seen.add(token[1]);
    tokens.push(token[0]);
    remaining = remaining.slice(token[0].length);
  }
  if (!tokens.length && !noble) return null;
  return noble + tokens.sort().join(" ");
}

function matchesNumber(value, expected, tolerance = 1e-7) {
  const input = value.trim().replace(/\u2212/g,"-");
  const candidates = [];
  if (/^[+-]?\d+(?:[.,]\d+)?$/.test(input)) candidates.push(Number(input.replace(",",".")));
  if (/^[+-]?\d{1,3}(?:[.\u00a0 ]\d{3})+(?:,\d+)?$/.test(input)) {
    candidates.push(Number(input.replace(/[.\u00a0 ]/g,"").replace(",",".")));
  }
  return candidates.some(candidate => Math.abs(candidate - expected) < tolerance);
}
function fieldWidget(specification) {
  const wrapper = document.createElement("label");
  wrapper.className = "field";
  const name = document.createElement("span");
  name.textContent = specification.label;
  let control;
  if (specification.kind === "pick") {
    control = document.createElement("select");
    const blank = new Option("Selecciona…","");
    blank.disabled = true;
    control.add(blank);
    specification.options.forEach((option,index) => control.add(new Option(option,index)));
    control.value = "";
  } else {
    control = document.createElement("input");
    control.type = "text";
    control.inputMode = specification.kind === "number" ? "decimal" : "text";
    control.autocomplete = "off";
    control.spellcheck = false;
    if (specification.kind === "config") control.placeholder = "Ejemplo: 1s2 2s1";
  }
  wrapper.append(name,control);
  control.addEventListener("input",() => {
    control.removeAttribute("aria-invalid");
    delete control.dataset.checked;
  });
  function check() {
    let correct;
    if (specification.kind === "pick") correct = control.value === String(specification.answer);
    else if (specification.kind === "number") correct = matchesNumber(control.value,specification.answer,specification.tolerance);
    else correct = normalizeConfiguration(control.value) === normalizeConfiguration(specification.answer);
    control.setAttribute("aria-invalid",String(!correct));
    control.dataset.checked = String(correct);
    return correct;
  }
  return {wrapper,control,check};
}
function fieldGroup(parent, fields, draft) {
  const container = document.createElement("div");
  container.className = "exercise-fields";
  const widgets = fields.map((field,index) => {
    const widget = fieldWidget(field);
    if (draft[index] !== undefined) widget.control.value = draft[index];
    const remember = () => { draft[index] = widget.control.value; queueSave(); };
    widget.control.addEventListener("input",remember);
    widget.control.addEventListener("change",remember);
    return widget;
  });
  container.append(...widgets.map(widget => widget.wrapper));
  parent.append(container);
  return widgets;
}
function checkFields(widgets) {
  const passed = widgets.map(widget => widget.check()).filter(Boolean).length;
  return {passed,total:widgets.length};
}

function showExercise(unit,lesson,study) {
  const exerciseIndex = bounded(study.exercise,lesson.exercises.length);
  const exercise = lesson.exercises[exerciseIndex];
  const caseIndex = bounded(study.cases[exercise.id],exercise.cases.length);
  const task = exercise.cases[caseIndex];
  const multiple = exercise.cases.length > 1;
  text("exercise-position","Ejercicio " + (exerciseIndex + 1) + " de " + lesson.exercises.length);
  text("exercise-title",exercise.title);
  text("exercise-prompt",exercise.prompt);
  byId("reading").hidden = !exercise.excerpt;
  byId("reading").open = Boolean(exercise.excerpt);
  textBlock("excerpt",exercise.excerpt);
  renderExerciseTable(exercise.table);
  text("check",task.kind === "written" ? "Comparar mi respuesta" : "Corregir");
  text("reference-text",exercise.reference);
  byId("reference").hidden = !exercise.reference;
  byId("reference").open = false;
  byId("case-nav").hidden = !multiple;
  text("case-count","Caso " + (caseIndex + 1) + " de " + exercise.cases.length);
  text("case-label",task.label);
  list("solution-steps",task.pasosSolucion,"li");
  text("solution-result-label",task.kind === "written" ? "Respuesta modelo" : "Respuesta");
  const item = task.fields[0];
  const truth = task.fields.length === 1 && item.options?.join("|") === "Verdadero|Falso";
  const answer = task.why.replace(/\bElige una respuesta:\s*/g,"");
  text("solution-text",truth ? item.options[item.answer] + ". " + answer : answer);
  byId("solution").open = false;
  const inputs = byId("exercise-inputs");
  inputs.replaceChildren();
  setFeedback(caseSolved(exercise,caseIndex) ? "Ya resolviste este caso. Puedes volver a intentarlo." : "");
  const key = exercise.id + ":" + caseIndex;
  if (!Array.isArray(state.drafts[key])) state.drafts[key] = [];
  const draft = state.drafts[key];
  let check;
  if (task.kind === "written") check = writtenBuilder(inputs,task,draft);
  else if (task.kind === "order") check = orderBuilder(inputs,task,draft);
  else if (task.kind === "boxBuild" || task.kind === "pointBuild") check = graphBuilder(inputs,task,draft);
  else if (task.kind === "circuit") check = circuitBuilder(inputs,task,draft);
  else if (task.kind === "orbital" || task.kind === "lewis") check = electronBuilder(inputs,task,draft);
  else {
    if (task.diagram) {
      const panel = document.createElement("div");
      panel.className = "builder";
      inputs.append(panel);
      boxPlot(panel,task.diagram);
    }
    const widgets = fieldGroup(inputs,task.fields,draft);
    check = () => checkFields(widgets);
  }

  function moveCase(index) {
    study.cases[exercise.id] = index;
    save();
    showExercise(unit,lesson,study);
    focusHeading("case-label");
  }
  function moveExercise(index) {
    study.exercise = index;
    save();
    showExercise(unit,lesson,study);
    focusHeading("exercise-title");
  }
  const previousCase = byId("previous-case");
  const nextCase = byId("next-case");
  previousCase.disabled = caseIndex === 0;
  nextCase.disabled = caseIndex === exercise.cases.length - 1;
  previousCase.onclick = () => moveCase(caseIndex - 1);
  nextCase.onclick = () => moveCase(caseIndex + 1);
  const nextCaseAction = byId("next-case-action");
  nextCaseAction.hidden = true;
  const previousExercise = byId("previous-exercise");
  const nextExercise = byId("next-exercise");
  previousExercise.disabled = exerciseIndex === 0;
  nextExercise.disabled = exerciseIndex === lesson.exercises.length - 1;
  previousExercise.onclick = () => moveExercise(exerciseIndex - 1);
  nextExercise.onclick = () => moveExercise(exerciseIndex + 1);
  function updateAction() {
    const caseDone = caseSolved(exercise,caseIndex);
    let following;
    if (caseDone && !nextCase.disabled) following = ["Siguiente caso ›",nextCase.onclick];
    else if (caseDone) {
      const unfinishedCase = exercise.cases.findIndex((_,index)=>!caseSolved(exercise,index));
      const unfinishedExercise = lesson.exercises.findIndex(item=>!exerciseSolved(item));
      if (unfinishedCase >= 0) following = ["Ir al caso pendiente ›",()=>moveCase(unfinishedCase)];
      else if (!nextExercise.disabled) following = ["Siguiente ejercicio ›",nextExercise.onclick];
      else if (unfinishedExercise >= 0) following = ["Ir al ejercicio pendiente ›",()=>moveExercise(unfinishedExercise)];
      else if (position(unit) < unit.lessons.length-1) {
        const nextTitle=unit.lessons[position(unit)+1].recap?"Ir a autoevaluación ›":"Siguiente tema ›";
        following = [nextTitle,()=>navigate(unit,position(unit)+1)];
      }
    }
    nextCaseAction.hidden = !following;
    byId("check").classList.toggle("next",!caseDone);
    if (following) {
      nextCaseAction.textContent=following[0];
      nextCaseAction.onclick=following[1];
    }
  }
  updateAction();
  renderBookmark();
  byId("hint").onclick = () => setFeedback("Pista. " + task.hint,true);
  checkAnswer = () => {
    const {passed,total,message} = check();
    if (message) {setFeedback(message,true);return;}
    if (passed === total) {
      state.solved[exercise.id + ":" + caseIndex] = true;
      save();
      renderProgress(unit);
      setFeedback(task.kind === "written" ? "Respuesta revisada. Puedes avanzar." : "Correcto. Puedes revisar el razonamiento en la solución explicada.");
      updateAction();
    } else {
      const count = total > 1 ? passed + " de " + total + " partes correctas. " : "Revisa tu respuesta. ";
      setFeedback(count + task.hint,true);
    }
  };
}
function setFeedback(message, hint = false) {
  const feedback = byId("exercise-feedback");
  feedback.classList.toggle("retry",hint);
  feedback.textContent = message;
}
byId("exercise-form").addEventListener("submit",event => {
  event.preventDefault();
  checkAnswer();
});


function textBlock(id, content) {
  const item = byId(id);
  item.hidden = !content;
  item.textContent = content || "";
}
function renderExerciseTable(rows) {
  const area = byId("data-table");
  area.hidden = !rows;
  area.replaceChildren();
  if (!rows) return;
  const table = document.createElement("table");
  const header = table.createTHead().insertRow();
  rows[0].forEach(value => {
    const th = document.createElement("th");
    th.scope = "col";
    th.textContent = value;
    header.append(th);
  });
  const body = table.createTBody();
  rows.slice(1).forEach(values => {
    const row = body.insertRow();
    values.forEach(value => { row.insertCell().textContent = value; });
  });
  area.append(table);
}
function writtenBuilder(parent,task,draft) {
  const wrapper = document.createElement("label");
  wrapper.className = "field";
  const name = document.createElement("span");
  name.textContent = "Tu respuesta";
  const response = document.createElement("textarea");
  response.rows = 4;
  response.value = draft[0] || "";
  response.addEventListener("input",() => { draft[0] = response.value; queueSave(); });
  wrapper.append(name,response);

  const rubric = document.createElement("label");
  rubric.className = "rubric";
  rubric.hidden = true;
  const reviewed = document.createElement("input");
  reviewed.type = "checkbox";
  rubric.append(reviewed,document.createTextNode(task.rubric));
  parent.append(wrapper,rubric);
  return () => {
    if (!response.value.trim()) {
      response.focus();
      return {message:"Escribe tu respuesta y luego compárala con la pauta."};
    }
    if (rubric.hidden) {
      byId("solution").open = true;
      text("check","Marcar como revisada");
      rubric.hidden = false;
      return {message:"Compara tu texto con el modelo y revisa el criterio. Puedes corregir tu respuesta antes de marcarla."};
    }
    if (!reviewed.checked) return {message:"Marca el criterio cuando tu respuesta lo cumpla."};
    return {passed:1,total:1};
  };
}

function orderBuilder(parent,task,draft) {
  const options = document.createElement("div");
  options.className = "controls";
  options.setAttribute("aria-label","Elementos para ordenar");
  const sequence = document.createElement("ol");
  sequence.className = "sequence";
  sequence.setAttribute("aria-live","polite");
  const undo = button("Quitar el último","nav-button");
  undo.onclick = () => {draft.pop();draw();queueSave();};
  const controls = task.items.map((value,index)=>{
    const item=button(value,"pill");
    item.onclick=()=>{draft.push(index);draw();queueSave();};
    options.append(item);
    return item;
  });
  parent.append(options,sequence,undo);
  draw();
  function draw(){
    controls.forEach((item,index)=>{
      item.disabled=draft.includes(index);
      item.setAttribute("aria-pressed",String(item.disabled));
    });
    sequence.replaceChildren(...draft.map(index=>{
      const li=document.createElement("li");
      li.textContent=task.items[index];
      return li;
    }));
    undo.disabled=!draft.length;
  }
  return () => ({
    passed:task.answer.filter((item,index)=>draft[index]===item).length,
    total:task.answer.length
  });
}

function sketch(target, description, draw) {
  const canvas = document.createElement("canvas");
  canvas.width = 1140;
  canvas.height = 390;
  canvas.setAttribute("role","img");
  canvas.setAttribute("aria-label",description);
  target.replaceChildren(canvas);
  const ctx=canvas.getContext("2d");
  ctx.scale(2,2);
  ctx.fillStyle="#f9fcf7";
  ctx.fillRect(0,0,570,195);
  ctx.lineCap="round";
  ctx.lineJoin="round";
  draw(ctx);
}
function boxPlot(target, values, selected = -1) {
  const titles=["Mínimo","C₁","C₂","C₃","Máximo"];
  const colors={axis:"#638278",box:"#dbeadb",bold:"#25624e"};
  const range=Math.max(1,values[4]-values[0]);
  const x=value=>80+(value-values[0])/range*410;
  const [min,l,m,r,max]=values.map(x);
  sketch(target,"Diagrama con "+titles.map((item,i)=>item+" "+values[i]).join(", "),ctx=>{
    line(ctx,[[65,146],[505,146]],colors.axis,1.5);
    line(ctx,[[min,94],[max,94]],colors.bold,3);
    ctx.fillStyle=colors.box;
    ctx.fillRect(l,70,r-l,48);
    ctx.strokeStyle=colors.bold;
    ctx.lineWidth=2;
    ctx.strokeRect(l,70,r-l,48);
    for (const [at,top,bottom] of [[min,84,104],[m,70,118],[max,84,104]]) line(ctx,[[at,top],[at,bottom]],colors.bold,3);
    const used=new Set();
    values.forEach((value,index)=>{
      const at=x(value);
      if (!used.has(value)) {
        label(ctx,String(value),at,171);
        dot(ctx,at,146,value===values[selected]?5:3,colors.bold);
        used.add(value);
      }
      if(index===selected) label(ctx,titles[index],at,48,colors.bold);
    });
  });
}
function pointGrid(target, base, image = [], description = "Plano cartesiano") {
  const xMax=Math.max(5,...[...base,...image].map(([x])=>Math.abs(x)));
  const yMax=Math.max(5,...[...base,...image].map(([,y])=>Math.abs(y)));
  const size= Math.min(16,78/yMax,208/xMax);
  const screen=([x,y])=>[285 + x * size,97 - y * size];
  const left=Math.floor(Math.min(225/size,16));
  const top=Math.floor(79/size);
  sketch(target,description,ctx=>{
    for (let i=-left;i<=left;i++) line(ctx,[screen([i,-top]),screen([i,top])],"#e0eadf",1);
    for (let i=-top;i<=top;i++) line(ctx,[screen([-left,i]),screen([left,i])],"#e0eadf",1);
    line(ctx,[screen([-left,0]),screen([left,0])],"#729385",1.5);
    line(ctx,[screen([0,-top]),screen([0,top])],"#729385",1.5);
    const arrow=screen([left,0]);
    label(ctx,"x",Math.min(552,arrow[0]+13),arrow[1]);
    label(ctx,"y",285,8);
    const orig=base.map(screen);
    const moved=image.map(screen);
    if(moved.length) ctx.setLineDash([4,5]);
    line(ctx,[...orig,orig[0]],moved.length?"#789186":"#24634e",2.8);
    ctx.setLineDash([]);
    orig.forEach(([x,y],index)=>{
      dot(ctx,x,y,3.5,"#4b766a");
      label(ctx,"ABC"[index],x+(index===1?12:-11),Math.max(9,y-9));
    });
    if (moved.length) {
      line(ctx,moved.length===3?[...moved,moved[0]]:moved,"#247159",3);
      moved.forEach(([x,y],index)=>{
        dot(ctx,x,y,4,"#247159");
        label(ctx,"ABC"[index]+"′",x+(index===1?12:-11),Math.max(9,y-9));
      });
    }
  });
}
function graphBuilder(parent,task,draft) {
  const panel=document.createElement("div");
  panel.className="builder";
  parent.append(panel);
  const widgets=fieldGroup(parent,task.fields,draft);
  const isBox=task.kind==="boxBuild";
  const graphFields=widgets.slice(0,isBox?5:6);
  graphFields.forEach(({control})=>control.addEventListener("input",draw));
  draw();
  return () => checkFields(widgets);

  function draw() {
    const values=graphFields.map(({control})=>{
      const value=control.value.trim().replace(/\u2212/g,"-").replace(",",".");
      return /^[+-]?\d+(?:\.\d+)?$/.test(value)?Number(value):null;
    });
    if (isBox) {
      if (values.every((item,i)=>item!==null && (i===0 || item>=values[i-1]))) boxPlot(panel,values);
      else panel.textContent="Completa los cinco valores ordenados de menor a mayor para dibujar el cajón.";
    } else {
      const ready=values.every(value=>value!==null && Number.isInteger(value) && Math.abs(value)<=15);
      const points=ready?[values.slice(0,2),values.slice(2,4),values.slice(4,6)]:[];
      pointGrid(panel,task.points,points,points.length?"Triángulo original y figura con tus coordenadas":"Triángulo original");
    }
  }
}
function showMathVisual(visual) {
  const board=byId("board");
  const legend=byId("legend");
  if(visual.kind==="mathBox") {
    const values=[2,4,7,9,13];
    switcher(["Mínimo","C₁","C₂","C₃","Máximo"],index=>{
      boxPlot(board,values,index);
      legend.textContent=["Mínimo: 2.","Primer cuartil: 4.","Mediana: 7.","Tercer cuartil: 9.","Máximo: 13."][index];
    });
  } else if(visual.kind==="isometry") {
    const base=[[1,1],[4,1],[1,4]];
    const labels=["Original","Traslación","Reflexión en Y","Rotación de 90°"];
    const transforms=[null,([x,y])=>[x-3,y-3],([x,y])=>[-x,y],([x,y])=>[-y,x]];
    const notes=["Figura original: A(1,1), B(4,1), C(1,4).","Tres unidades a la izquierda y tres hacia abajo.","Se conserva y, cambia el signo de x.","90° antihorarios alrededor del origen: (x,y) → (−y,x)."];
    switcher(labels,index=>{
      pointGrid(board,base,transforms[index]?base.map(transforms[index]):[],notes[index]);
      legend.textContent=notes[index];
    });
  } else if(visual.kind==="pythagoras") {
    const sides=[[[204,138],[364,138]],[[204,18],[204,138]],[[204,18],[364,138]]];
    const names=["Cateto 4","Cateto 3","Hipotenusa 5"];
    switcher(names,index=>{
      const explanation=["4² = 16.","3² = 9.","5² = 25. Se cumple que 16 + 9 = 25."][index];
      sketch(board,names[index]+". "+explanation,ctx=>{
        sides.forEach((side,i)=>line(ctx,side,i===index?"#23845b":"#a5b9ad",i===index?6:3));
        line(ctx,[[204,123],[219,123],[219,138]],"#56736a",2);
        label(ctx,"4",284,160);
        label(ctx,"3",188,80);
        label(ctx,"5",299,65);
      });
      legend.textContent=explanation;
    });
  } else if(visual.kind==="cylinder") {
    switcher(["Cilindro","Desarrollo plano"],mode=>{
      sketch(board,mode?"Dos círculos y un rectángulo":"Cilindro de radio r y altura h",ctx=>{
        const ellipse=(x,y,rx,ry)=>{
          ctx.beginPath();
          ctx.strokeStyle="#436a5d";
          ctx.lineWidth=2;
          ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
          ctx.fillStyle="#e3efe1";ctx.fill();ctx.stroke();
        };
        if(mode) {
          ellipse(165,63,37,37);ellipse(165,145,37,37);
          ctx.fillStyle="#e3efe1";ctx.fillRect(222,53,193,91);
          ctx.strokeStyle="#436a5d";ctx.strokeRect(222,53,193,91);
          label(ctx,"2πr",318,163);label(ctx,"h",438,99);
        } else {
          ellipse(280,143,65,23);
          ctx.fillStyle="#dfebdf";ctx.fillRect(215,53,130,90);
          line(ctx,[[215,53],[215,143]],"#436a5d",2);
          line(ctx,[[345,53],[345,143]],"#436a5d",2);
          ellipse(280,53,65,23);
          line(ctx,[[280,53],[345,53]],"#436a5d",2);label(ctx,"r",314,42);
          label(ctx,"h",367,100);
        }
      });
      legend.textContent=mode?"El largo del rectángulo coincide con 2πr. El ancho es h.":"Hay dos bases circulares iguales. r es el radio y h, la altura.";
    });
  }
}

function render() {
  const unit = activeUnit();
  const index = position(unit);
  const lesson = activeLesson(unit);
  text("unit-type",unit.unit);
  text("unit-title",unit.title);
  text("unit-description",unit.description);
  text("lesson-count",lesson.recap ? "Autoevaluación de la unidad" : "Tema " + (index + 1) + " de " + (unit.lessons.length - 1));
  text("lesson-title",lesson.title);
  text("lesson-goal",lesson.goal);
  renderProgress(unit);
  renderMode(unit);
  const previous = byId("previous");
  const next = byId("next");
  previous.disabled = index === 0;
  previous.textContent = "‹ Tema anterior";
  previous.onclick = () => navigate(unit,index-1);
  const last = index === unit.lessons.length - 1;
  next.disabled = last;
  next.textContent = last ? "Último tema" : (unit.lessons[index + 1].recap ? "Ir a autoevaluación ›" : "Siguiente tema ›");
  next.onclick = () => {if (!last) navigate(unit,index+1);};
}

toggleFocus();
render();
</script>
